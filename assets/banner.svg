<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200"
     viewBox="0 0 1000 200" role="img"
     aria-label="Luisa Campanha - CS Student | Systems, Security and AI Research">

  <style>
    text { animation: aparecer 1.5s ease-in both; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#3b0764"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1"   stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <path d="M0 0 H1000 V150
           Q 875 200 750 150
           T 500 150
           T 250 150
           T 0 150 Z"
        fill="url(#fundo)"/>

  <text x="500" y="78" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff">Luisa Campanha</text>

  <text x="500" y="112" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" fill="#f1f5f9">CS Student | Systems, Security &amp; AI Research</text>
</svg>
